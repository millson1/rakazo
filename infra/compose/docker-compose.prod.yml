name: rakazo-prod

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 2g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rakazo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rakazo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rakazo} -d ${POSTGRES_DB:-rakazo}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: builds `rakazo/computer:local` so the supervisor can spawn bot desktops. Docker is
  # the production default; without this image a `SANDBOX_PROVIDER=docker` stack cannot start a
  # computer. E2B/Daytona/Box do not use it.
  computer:
    image: ${RAKAZO_COMPUTER_IMAGE:-rakazo/computer:local}
    build:
      context: ../sandboxes/computer
    command: ["true"]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - app

  data-init:
    image: busybox:1
    command: ["chown", "-R", "1000:1000", "/data"]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    volumes:
      - appdata:/data
    networks:
      - app

  # Holds the Docker socket to spawn bot computers. Unpublished, `app` network only — same
  # containment as the updater. Access is equivalent to control of the Docker host, so Caddy on
  # `edge` has no route here. Runs from the application image; an in-app update recreates it
  # with api/worker/web so the supervisor stays on the same tag.
  supervisor:
    image: ${RAKAZO_IMAGE:-ghcr.io/millson1/rakazo/app}:${RAKAZO_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    command: ["pnpm", "--filter", "@rakazo/sandbox-supervisor", "start"]
    init: true
    user: root
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      SUPERVISOR_HOST: "0.0.0.0"
      SUPERVISOR_PORT: "7091"
      DOCKER_SOCKET: /var/run/docker.sock
      RAKAZO_COMPUTER_IMAGE: ${RAKAZO_COMPUTER_IMAGE:-rakazo/computer:local}
      SANDBOX_SCREEN_NETWORK: internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - appdata:/data
    networks:
      - app
    depends_on:
      computer:
        condition: service_completed_successfully
      data-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:7091/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    # The tag is what the updater moves. `docker compose pull` fetches it, `up -d` recreates onto
    # it, and the previous tag stays in .env so a rollback is one redeploy rather than a rebuild.
    #
    # The default tag is `local`, which no registry serves, so a fresh install builds from the
    # checkout via `up -d --build` instead of failing on a `pull` of an image that does not exist
    # yet. Once a release is published, pin RAKAZO_IMAGE_TAG to it and the pull path takes over.
    image: ${RAKAZO_IMAGE:-ghcr.io/millson1/rakazo/app}:${RAKAZO_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    command:
      - bash
      - -lc
      - export DATABASE_URL="$$(node -e 'const e=process.env;const q=(s)=>encodeURIComponent(s||"");process.stdout.write(`postgres://$${q(e.POSTGRES_USER||"rakazo")}:$${q(e.POSTGRES_PASSWORD)}@postgres:5432/$${e.POSTGRES_DB||"rakazo"}`)')" && pnpm --filter @rakazo/db exec prisma migrate deploy && pnpm --filter @rakazo/api start
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1536m
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      POSTGRES_USER: ${POSTGRES_USER:-rakazo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rakazo}
      DATA_DIR: /data
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-docker}
      SANDBOX_SUPERVISOR_URL: http://supervisor:7091
      WAKEUP_DRIVER: graphile
      AGENT_RUNTIME: pi
      RAKAZO_UPDATER_URL: http://updater:7092
    expose:
      - "3100"
    volumes:
      - appdata:/data
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
      supervisor:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    image: ${RAKAZO_IMAGE:-ghcr.io/millson1/rakazo/app}:${RAKAZO_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    command:
      - bash
      - -lc
      - export DATABASE_URL="$$(node -e 'const e=process.env;const q=(s)=>encodeURIComponent(s||"");process.stdout.write(`postgres://$${q(e.POSTGRES_USER||"rakazo")}:$${q(e.POSTGRES_PASSWORD)}@postgres:5432/$${e.POSTGRES_DB||"rakazo"}`)')" && pnpm --filter @rakazo/worker start
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 2g
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      POSTGRES_USER: ${POSTGRES_USER:-rakazo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rakazo}
      DATA_DIR: /data
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-docker}
      SANDBOX_SUPERVISOR_URL: http://supervisor:7091
      WAKEUP_DRIVER: graphile
      AGENT_RUNTIME: pi
    volumes:
      - appdata:/data
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    image: ${RAKAZO_IMAGE:-ghcr.io/millson1/rakazo/app}:${RAKAZO_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    command: ["pnpm", "--filter", "@rakazo/web", "preview", "--host", "0.0.0.0", "--port", "5173"]
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      API_PROXY_TARGET: http://api:3100
    expose:
      - "5173"
    networks:
      - edge
      - app
    depends_on:
      api:
        condition: service_healthy

  # The updater holds the Docker socket, which is root-equivalent on the host, so it is deliberately
  # the narrowest *update* service here: no `ports` (nothing on the host), and only the `app` network,
  # so Caddy — which sits on `edge` — has no route to it. The API reaches it as http://updater:7092
  # with the shared token. It is also the one socket-holder the update never recreates, because it is
  # the process performing the update. The sandbox supervisor also mounts the socket (to spawn bot
  # computers) under the same unpublished / app-network rules.
  updater:
    # Pinned separately from the application image: the updater does not recreate itself, so moving
    # its own version is an operator action, not something an update can do underneath itself.
    image: ${RAKAZO_UPDATER_IMAGE:-ghcr.io/millson1/rakazo/updater}:${RAKAZO_UPDATER_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/updater/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    init: true
    user: root
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      RAKAZO_UPDATER_HOST: "0.0.0.0"
      RAKAZO_UPDATER_PORT: "7092"
      # Must equal the host path it is mounted from, or Compose would derive a different project
      # name and every relative bind mount in this file would resolve somewhere else.
      RAKAZO_DEPLOY_DIR: ${RAKAZO_DEPLOY_DIR:?Set RAKAZO_DEPLOY_DIR to the absolute path of this checkout}
      RAKAZO_COMPOSE_FILE: infra/compose/docker-compose.prod.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RAKAZO_DEPLOY_DIR:?Set RAKAZO_DEPLOY_DIR to the absolute path of this checkout}:${RAKAZO_DEPLOY_DIR:?Set RAKAZO_DEPLOY_DIR to the absolute path of this checkout}
    networks:
      - app
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:7092/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: 256m
    environment:
      RAKAZO_HOST: ${RAKAZO_HOST:-app.example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${CADDYFILE_PATH:-./Caddyfile.prod}:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks:
      - edge
      - app
    tmpfs:
      - /tmp
    depends_on:
      web:
        condition: service_started

volumes:
  pgdata:
  appdata:
  caddydata:
  caddyconfig:

networks:
  edge:
  app:
  data:
    internal: true
